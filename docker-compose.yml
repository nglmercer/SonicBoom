# SonicBoom production Compose file.
#
# First run:
#   1. Copy the secret template:  cp .env.example .env  (then edit it)
#      At minimum set SONICBOOM_ADMIN_PW (12+ chars) and ALLOWED_AUDIO_DIR
#      (playback profile only).
#   2. docker compose up -d
#
# Token data lives in the named `tokendata` volume (created automatically),
# so there is no missing-file bind problem. To seed from a local file once:
#   printf '[]\n' > tokens.json   # then import via the admin panel
#
# Network exposure: backend ports bind to 127.0.0.1 by default. Do not
# expose SonicBoom's plain HTTP backend directly to the public Internet —
# terminate TLS at a reverse proxy, set COOKIE_SECURE=true for HTTPS, and
# enable HSTS only when HTTPS is guaranteed (see docs/config.md).
services:
  sonicboom:
    build:
      context: .
      target: runtime
    # Loopback-only by default: the backend speaks plain HTTP, so it must
    # not be published on all host interfaces. Terminate TLS at a reverse
    # proxy on this host (or in this network) and forward to 127.0.0.1:3000.
    # To expose on the LAN intentionally, override with e.g.:
    #   ports: ["0.0.0.0:3000:3000"]   (or set BIND_ADDR=0.0.0.0 below)
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3000:3000"
    volumes:
      - ./models:/app/models
      - tokendata:/app/data
    tmpfs:
      - /tmp
    environment:
      - PORT=3000
      - RUST_LOG=info
      - MODEL_CACHE_DIR=/app/models
      - TOKEN_STORE_PATH=/app/data/tokens.json
      - LOG_DIR=/app/logs
      # Required: admin panel credentials (no defaults).
      - SONICBOOM_ADMIN_ID=${SONICBOOM_ADMIN_ID:-admin}
      - SONICBOOM_ADMIN_PW=${SONICBOOM_ADMIN_PW:?Set SONICBOOM_ADMIN_PW in your environment or .env file}
      # Set to true only when terminating TLS at a reverse proxy in front.
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      # Custom model trust (only needed with a custom MODEL_REVISION):
      # - MODEL_SHA256_JSON_PATH=/app/data/models.sha256.json
      # Strict-Transport-Security (only when all traffic is known-HTTPS):
      # - ENABLE_HSTS=true
    env_file:
      - path: .env
        required: false
    # The image already runs as uid 10001; pin it here too for clarity.
    user: "10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Local speaker playback (ALSA). Requires an audio device and an explicit
  # allowed directory for filesystem queueing.
  sonicboom-playback:
    build:
      context: .
      target: runtime-playback
    # Loopback-only by default (see `sonicboom` above for the rationale and
    # how to intentionally expose on the LAN).
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3002:3000"
    volumes:
      - ./models:/app/models
      - tokendata:/app/data
      - ${ALLOWED_AUDIO_DIR:?Set ALLOWED_AUDIO_DIR to a host directory of audio files}:/audio:ro
    tmpfs:
      - /tmp
    environment:
      - PORT=3000
      - RUST_LOG=info
      - MODEL_CACHE_DIR=/app/models
      - TOKEN_STORE_PATH=/app/data/tokens.json
      - LOG_DIR=/app/logs
      - ALLOWED_AUDIO_DIR=/audio
      - SONICBOOM_ADMIN_ID=${SONICBOOM_ADMIN_ID:-admin}
      - SONICBOOM_ADMIN_PW=${SONICBOOM_ADMIN_PW:?Set SONICBOOM_ADMIN_PW in your environment or .env file}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
    env_file:
      - path: .env
        required: false
    user: "10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    devices:
      - /dev/snd:/dev/snd
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
    profiles:
      - playback
    restart: unless-stopped

  # GPU (CUDA) version
  sonicboom-cuda:
    build:
      context: .
      target: runtime-cuda
    # Loopback-only by default (see `sonicboom` above for the rationale and
    # how to intentionally expose on the LAN).
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3001:3000"
    volumes:
      - ./models:/app/models
      - tokendata:/app/data
    tmpfs:
      - /tmp
    environment:
      - PORT=3000
      - RUST_LOG=info
      - MODEL_CACHE_DIR=/app/models
      - TOKEN_STORE_PATH=/app/data/tokens.json
      - LOG_DIR=/app/logs
      - SONICBOOM_ADMIN_ID=${SONICBOOM_ADMIN_ID:-admin}
      - SONICBOOM_ADMIN_PW=${SONICBOOM_ADMIN_PW:?Set SONICBOOM_ADMIN_PW in your environment or .env file}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
    env_file:
      - path: .env
        required: false
    user: "10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          cpus: "8"
          memory: 16G
    profiles:
      - cuda
    restart: unless-stopped

volumes:
  tokendata:
