[package]
name = "SonicBoom"
version = "0.1.0"
edition = "2024"
description = "High-performance web server that generates Text-to-Speech audio using the Supertonic 3 ONNX model."
license = "MIT"
repository = "https://github.com/nglmercer/SonicBoom"
default-run = "SonicBoom"

[lib]
name = "sonicboom"
path = "src/lib.rs"

[features]
# Standalone server build (default). The TikTools process plugin deliberately
# enables neither the server nor playback feature.
# Native voice-cloning backends ship in default builds so every engine works
# without a rebuild; providers stay disabled by default, so only the
# Supertonic weights download until an engine is enabled.
# The Qwen3 Vulkan backend ships in default builds too: `device = "vulkan"`
# works without a rebuild wherever a Vulkan GPU exists, falling back to CPU
# otherwise. This makes the Vulkan SDK (glslc, loader/headers, SPIRV-Headers)
# a hard build requirement for default builds; build CPU-only with
# `--no-default-features --features qwen-gguf` instead. CUDA stays an
# explicit opt-in (`qwen-gguf-cuda`).
#
# Candle migration: the candle engine ships in default builds too. `model.backend =
# "auto"` then runs the Supertonic graphs on candle (ONNX Runtime stays selectable with
# `model.backend = "ort"`), and the `qwen3-candle` / `kyutai-candle` providers are available
# (disabled until enabled in `[providers.*]`). `candle-vulkan` adds the Vulkan device and
# needs `slangc` (Slang shader compiler) at build time on top of the Vulkan SDK; build without
# it via `--no-default-features --features server,qwen-gguf,candle-qwen,candle-kyutai`.
default = [
    "web-ui", "server", "playback", "qwen-gguf", "qwen-gguf-vulkan", "pocket-tts", "gui",
    "candle-vulkan", "candle-qwen", "candle-kyutai",
]
web-ui = ["server"]
# Android uses a separately installed, verified Bionic runtime (no binary download).
android-ort = ["ort/load-dynamic"]
server = [
    "dep:axum",
    "dep:tower",
    "dep:tower-http",
    "dep:tower-sessions",
    "dep:constant_time_eq",
    "dep:dotenvy",
    "dep:tracing-appender",
    "dep:tracing-subscriber",
    "dep:toml",
    "dep:notify",
    "dep:notify-debouncer-full",
]
# Server-side audio playback queue (requires ALSA on Linux).
playback = ["dep:rodio"]
# Desktop system tray. Linux uses ksni (pure-Rust StatusNotifierItem, no GTK);
# macOS/Windows use tao/tray-icon (native backends, no GTK compiled in).
# Only relevant on desktop systems.
gui = ["server", "web-ui", "dep:ksni", "dep:tray-icon", "dep:tao", "dep:image", "dep:open"]
# First-party TikTools process plugin. It contains only the reusable engine
# and SDK adapter; it does not start the HTTP server, tray, or playback queue.
tiktools-plugin = ["dep:tiktools-plugin-sdk"]
# Apple Silicon CoreML acceleration for ONNX inference (macOS only).
coreml = ["ort/coreml"]
# NVIDIA CUDA acceleration for ONNX inference (Linux/Windows).
cuda = ["ort/cuda"]
# AMD ROCm acceleration for ONNX inference (Linux).
rocm = ["ort/rocm"]
# NOTE: `coreml`, `cuda`, and `rocm` are mutually exclusive per platform.
# Enable at most one of them when building, e.g. `cargo build --release --features cuda`.
# Optional native voice-cloning providers. Pocket TTS compiles into default
# builds but stays disabled by default; Supertonic 3 is the default provider.
# Both run in-process with no Python/PyTorch.
# `pocket-tts` enables the Pocket TTS ONNX provider (CPU execution provider
# only; pure-Rust unigram tokenizer, no new native dependencies). It ships
# in default builds but stays disabled by default; weights download only
# after `[providers.pocket_tts] enabled=true`.
pocket-tts = []
# Native Qwen3-TTS 1.7B GGUF/ONNX backend (opt-in; ICL cloning only).
qwen-gguf = ["dep:tokenizers", "dep:rustfft", "dep:half", "dep:sonicboom-qwen-llama"]
qwen-gguf-vulkan = ["qwen-gguf", "sonicboom-qwen-llama/vulkan"]
qwen-gguf-cuda = ["qwen-gguf", "sonicboom-qwen-llama/cuda"]
# Candle inference backends (branch `candle` experiment, see docs/candle-migration.md).
# The candle fork is vendored under vendor/candle (see vendor/candle/UPSTREAM.md).
candle = ["dep:candle-core", "dep:candle-nn", "dep:candle-onnx"]
candle-vulkan = [
    "candle", "candle-core/vulkan", "candle-nn/vulkan",
    "qwen3-tts?/vulkan", "kyutai-tts?/vulkan",
]
# Candle voice providers. `candle-kyutai` builds the SentencePiece C++ sources; on
# GCC 14+ set CXXFLAGS="-include cstdint" (the vendored sources miss <cstdint>).
candle-qwen = ["candle", "dep:qwen3-tts"]
candle-kyutai = ["candle", "dep:kyutai-tts"]

[dependencies]
# Async runtime (only the features actually used)
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "signal",
    "net",
    "time",
    "fs",
    "sync",
    "io-util",
] }

# Web server
axum = { version = "0.8", features = ["macros", "multipart"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["trace", "timeout"], optional = true }

# Sessions (Admin panel)
tower-sessions = { version = "0.14", features = ["memory-store"], optional = true }

# ONNX inference (CoreML is macOS-only and opt-in via the `coreml` feature;
# CUDA/ROCm are opt-in via the `cuda`/`rocm` features).
# NOTE: `ort` has no stable 2.x release yet (latest is 2.0.0-rc.13 as of
# 2026-09-16); pin to a stable release once one is published. Reviewed
# 2026-09-16: rc.11 -> rc.13, no advisory on the RC series. Migration:
# providers moved `execution_providers::*ExecutionProvider` to short
# `ep::{CUDA, ROCm, CoreML}` names, `commit_from_file` takes `&mut`, and
# `with_execution_providers` errors (builder-carrying, not Send/Sync) are
# rendered via Display. Verified: CPU/cuda/rocm/coreml checks green.

ndarray = "0.17"

sonicboom-qwen-llama = { path = "native/qwen-llama", optional = true }
candle-core = { path = "vendor/candle/candle-core", optional = true }
candle-nn = { path = "vendor/candle/candle-nn", optional = true }
candle-onnx = { path = "vendor/candle/candle-onnx", optional = true }
qwen3-tts = { path = "vendor/qwen3-tts", optional = true }
kyutai-tts = { path = "vendor/kyutai-tts", optional = true }
tokenizers = { version = "0.22", default-features = false, features = ["onig"], optional = true }
rustfft = { version = "6.2", optional = true }
half = { version = "2", optional = true }

# Audio encoding/decoding
opus = "0.4"
ogg = "0.9"
hound = "3.5"
shine-rs = "0.1"
flacenc = "0.5"

# Audio playback (server-side queue)
rodio = { version = "0.19", optional = true }

# HuggingFace model download

futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Security: constant-time comparison to prevent timing attacks
constant_time_eq = { version = "0.3", optional = true }

# Error handling
anyhow = "1"
thiserror = "2"

# Structured configuration (config.toml)
toml = { version = "0.8", optional = true }

# Hot reload: filesystem watcher with debouncing (config.toml)
notify = { version = "8", optional = true }
notify-debouncer-full = { version = "0.5", optional = true }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"], optional = true }
tracing-appender = { version = "0.2", optional = true }

# Utilities
dotenvy = { version = "0.15", optional = true }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
hex = "0.4"
rand = "0.9"
sha2 = "0.10"
unicode-normalization = "0.1"
time = "0.3"

# Tray icon (Desktop GUI only — gated behind the `gui` feature)
image = { version = "0.25", optional = true }
open = { version = "5.3", optional = true }

# Linux tray: pure-Rust StatusNotifierItem (D-Bus only, no GTK system libs).
# Deliberately NOT tao/tray-icon: their Linux backends pull the unmaintained
# GTK3 bindings (glib 0.18, RUSTSEC-2024-0429) into every build.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"], optional = true }

# macOS/Windows tray: tao/tray-icon with native backends. GTK/glib appear in
# Cargo.lock via these crates' Linux-only backend deps, but they are compiled
# into no artifact on any target (see .cargo/audit.toml for verification).
[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = { version = "0.19", optional = true }
tao = { version = "0.30", optional = true }

# Windows file identity for the config watcher's metadata snapshot.
# `std::os::windows::fs::MetadataExt::file_index`/`volume_serial_number` are
# still nightly-only, so query `GetFileInformationByHandle` through the same
# windows-sys family the rest of the Windows dependency graph already uses.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

# Pinned to an immutable revision of the `remake` branch (retrieved 2026-09-16).
# Update intentionally via `cargo update -p tiktools-plugin-sdk` and review the diff.
[dependencies.tiktools-plugin-sdk]
git = "https://github.com/nglmercer/TikTools-app"
rev = "bd38b41fe8415993b5eeee7e780e42766d7cc7f0"
package = "tiktools-plugin-sdk"
optional = true

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "SonicBoom"
path = "src/main.rs"
required-features = ["server"]

[[bin]]
name = "sonicboom-tiktools-plugin"
path = "src/bin/sonicboom-tiktools-plugin.rs"
required-features = ["tiktools-plugin"]

[profile.release]
lto = true
opt-level = 3
strip = true
panic = "unwind"
codegen-units = 1

# esaxx 0.1.10 forces /MT; match Rust, knf and ORT /MD on MSVC.
[patch.crates-io]
# Android: release ORT environment before the Android AAR C++ destructors.
ort = { path = "vendor/ort" }
esaxx-rs = { path = "vendor/esaxx-rs" }
# Temporary compatibility patch until ksni adopts maintained zbus 6.
ksni = { path = "vendor/ksni" }

[[example]]
name = "qwen_gguf_smoke"
required-features = ["qwen-gguf"]

[[example]]
name = "cache_benchmark"
required-features = ["qwen-gguf"]

# Keep desktop ORT defaults, including its binary distribution strategy.
[target.'cfg(not(target_os = "android"))'.dependencies]
ort = { version = "=2.0.0-rc.13", features = ["ndarray"] }
reqwest = { version = "0.12", features = ["stream"] }

# rc.13 defaults to API 27. Android's pinned 1.24.3 AAR supplies API 24;
# select that API explicitly rather than loading an incompatible runtime.
[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "tracing", "api-24", "load-dynamic"] }

[[example]]
name = "pocket_smoke"
required-features = ["pocket-tts"]

[[example]]
name = "qwen_backend_probe"
required-features = ["qwen-gguf"]

[[example]]
name = "supertonic_backend_bench"
required-features = []
