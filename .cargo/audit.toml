# cargo-audit configuration (https://docs.rs/cargo-audit)
#
# Auto-discovered by `cargo audit` from `.cargo/audit.toml`.
#
# The `validate` CI job runs `cargo audit --deny unmaintained --deny unsound`
# as a gate (see .github/workflows/ci.yml). Any NEW advisory on a crate we
# depend on that is not listed here fails the build.
#
# Each ignored advisory below documents: why it is present, whether the
# affected code is compiled into our targets, whether it is reachable at
# runtime, and the migration plan. Review this list on every dependency bump.
# Last full review: 2026-09-16 (see "Review notes" at the bottom).
#
# Note on `cargo deny`: evaluated and deliberately not added. `cargo audit`
# already gates advisories (including unmaintained/unsound); a second advisory
# scanner would duplicate that check without adding policy. License/ban
# linting is low-value here (all direct deps are MIT/Apache-2.0 or
# permissive; see `cargo tree -e license` on demand).
[advisories]
ignore = [
    # --- build-time proc-macros, `gui` feature only ---
    # paste: unmaintained proc-macro helper, pulled via
    # image -> ravif -> rav1e (`gui` feature's tray-icon decoding only).
    # A proc-macro: compiled for the build host, never linked into any
    # binary, and only when `--features gui` is enabled. Server, headless,
    # Docker, and TikTools builds never see it. Migration: disappears if
    # `image` drops its AVIF/rav1e path or if the tray icon moves to a
    # decoder without it; no maintained fork to switch to.
    "RUSTSEC-2024-0436", # paste - unmaintained (gui-only proc-macro via image/rav1e)
    # proc-macro-error: unmaintained, pulled via glib-macros/gtk3-macros
    # (derive diagnostics for the GTK3 bindings below). Proc-macro only:
    # never linked into any binary. Migration: disappears with the GTK3
    # stack if the macOS/Windows tray ever moves off tao/tray-icon.
    "RUSTSEC-2024-0370", # proc-macro-error - unmaintained (gui-only proc-macro)
    # core2: unmaintained `no_std` polyfill, pulled via
    # image -> ravif -> rav1e -> bitstream-io (`gui` feature only; the
    # earlier "wasm transitive via reqwest" note was stale — reqwest no
    # longer pulls it). Never compiled for server/headless/container
    # targets. Migration: same as `paste` (tied to image's AVIF path).
    "RUSTSEC-2026-0105", # core2 - unmaintained (gui-only via image/rav1e)
    # --- `gui` feature, macOS/Windows targets only (never compiled on Linux) ---
    # instant: unmaintained time shim used by tao/winit. Only in the graph
    # via tao, which is now a non-Linux-only dependency of `--features gui`.
    # The Linux GUI tray uses ksni (StatusNotifierItem, no tao/winit/GTK),
    # so `instant` is compiled into no Linux artifact at all. Migration:
    # upstream winit 0.30 rewrite; out of scope for the server threat model.
    "RUSTSEC-2024-0384", # instant - unmaintained (via tao, non-Linux gui only)
    # glib: unsound `VariantStrIter` iterator. Present in Cargo.lock ONLY via
    # tao/tray-icon, which are now `cfg(not(target_os = "linux"))`
    # dependencies of `--features gui`. Verified 2026-09-16 that glib is
    # compiled into NO shipped artifact on ANY target:
    #   cargo tree --features gui --target x86_64-unknown-linux-gnu -i glib
    #     -> "nothing to print" (Linux GUI uses ksni/SNI, no GTK)
    #   cargo tree --features gui --target x86_64-pc-windows-msvc -i glib
    #     -> "nothing to print" (native backend, GTK is Linux-only there)
    #   cargo tree --features gui --target aarch64-apple-darwin -i glib
    #     -> "nothing to print" (native backend)
    # `cargo audit` still flags it because it scans the target-union lockfile
    # (see `--target all`), not per-target builds — that is the sole reason
    # this exception remains. Re-verify with the commands above on every
    # tao/tray-icon bump. Full removal requires tao/tray-icon to drop their
    # Linux GTK backend (even newest 0.37/0.25 still use gtk 0.18) or a
    # native macOS/Windows tray rewrite; the Linux SNI migration was the
    # smallest maintainable step and is done.
    "RUSTSEC-2024-0429", # glib - unsound VariantStrIter (lockfile-only via non-Linux gui)
    # gdkwayland-sys/gdk/atk/gdkx11-sys/gtk/atk-sys/gdk-sys/gtk3-macros/gtk-sys:
    # unmaintained GTK3 sys bindings. Same situation as glib above:
    # lockfile-only via non-Linux `--features gui`, compiled into no
    # artifact on any target (same verification commands with `-i gtk`).
    "RUSTSEC-2024-0411", # gdkwayland-sys - unmaintained (lockfile-only via non-Linux gui)
    "RUSTSEC-2024-0412", # gdk - unmaintained (lockfile-only via non-Linux gui)
    "RUSTSEC-2024-0413", # atk - unmaintained (lockfile-only via non-Linux gui)
    "RUSTSEC-2024-0414", # gdkx11-sys - unmaintained (lockfile-only via non-Linux gui)
    "RUSTSEC-2024-0415", # gtk - unmaintained (lockfile-only via non-Linux gui)
    "RUSTSEC-2024-0416", # atk-sys - unmaintained (lockfile-only via non-Linux gui)
    "RUSTSEC-2024-0418", # gdk-sys - unmaintained (lockfile-only via non-Linux gui)
    "RUSTSEC-2024-0419", # gtk3-macros - unmaintained (lockfile-only via non-Linux gui)
    "RUSTSEC-2024-0420", # gtk-sys - unmaintained (lockfile-only via non-Linux gui)
]

