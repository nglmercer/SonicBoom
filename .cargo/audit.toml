#   guarded by new encoder round-trip tests in src/tts/audio.rs.
# - `ort` reviewed and bumped 2.0.0-rc.11 -> 2.0.0-rc.13 (no stable 2.x
#   exists; no advisory on the RC series). Migration: `ep::{CUDA, ROCm,
#   CoreML}` renames, `&mut` session builder, Display-rendered provider
#   errors. CPU/cuda/rocm/coreml checks all green.
# - Linux `--features gui` migrated from tao/tray-icon to ksni 0.3.6
#   (StatusNotifierItem): the Linux GUI binary no longer compiles any GTK
#   code. tao/tray-icon remain ONLY for macOS/Windows trays, where they
#   never compiled GTK either (verified per-target with `cargo tree -i`).
# - paste/core2 pull chains corrected: both come via image->ravif->rav1e
#   (gui-only), not via ort/tracing/reqwest as previously documented.
# - ksni 0.3.6 subtree (zbus etc.) audited clean, no new exceptions needed.
