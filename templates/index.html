<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SonicBoom TTS</title>
<link rel="stylesheet" href="/static/index.css">
</head>
<body data-model-ready="MODEL_READY_JS">
<div class="card">
  <h1>SonicBoom TTS</h1>
  <div class="model-status" id="modelStatus" STATUS_HIDDEN>STATUS_MSG</div>

  <div class="form-group">
    <label for="apiToken">API Token (required — create one in the <a href="/admin">admin panel</a>)</label>
    <input type="password" id="apiToken" placeholder="Paste your API token here" autocomplete="off" spellcheck="false">
  </div>

  <div class="form-group">
    <label for="text">Text Input</label>
    <textarea id="text" placeholder="Enter text to convert to speech..."></textarea>
  </div>

  <div class="row">
    <div class="field">
      <label for="voice">Voice Model</label>
      <select id="voice" VOICE_DISABLED>
        VOICE_OPTIONS
      </select>
    </div>
    <div class="field">
      <label for="lang">Language</label>
      <select id="lang" VOICE_DISABLED>
        <option value="en">English</option>
        <option value="ko">Korean</option>
        <option value="ja">Japanese</option>
        <option value="zh">Chinese</option>
        <option value="es">Spanish</option>
        <option value="pt">Portuguese</option>
        <option value="fr">French</option>
        <option value="de">German</option>
        <option value="it">Italian</option>
        <option value="ru">Russian</option>
        <option value="ar">Arabic</option>
        <option value="hi">Hindi</option>
        <option value="nl">Dutch</option>
        <option value="pl">Polish</option>
        <option value="tr">Turkish</option>
        <option value="vi">Vietnamese</option>
        <option value="id">Indonesian</option>
        <option value="th">Thai</option>
        <option value="sv">Swedish</option>
        <option value="da">Danish</option>
        <option value="fi">Finnish</option>
        <option value="el">Greek</option>
        <option value="cs">Czech</option>
        <option value="sk">Slovak</option>
        <option value="sl">Slovenian</option>
        <option value="hr">Croatian</option>
        <option value="ro">Romanian</option>
        <option value="hu">Hungarian</option>
        <option value="bg">Bulgarian</option>
        <option value="uk">Ukrainian</option>
        <option value="lt">Lithuanian</option>
        <option value="lv">Latvian</option>
        <option value="et">Estonian</option>
      </select>
    </div>
  </div>

  <button id="btn" BTN_DISABLED>Generate Speech</button>
  <div id="status"></div>
  <audio id="player" controls></audio>

  <p class="footer">
    Powered by <a href="https://huggingface.co/Supertone/supertonic-3" target="_blank" rel="noopener">Supertonic 3</a>
  </p>
</div>

<script src="/static/index.js" defer></script>
</body>
</html>
